[program:canyum-backend]
directory=/var/www/canyum-exam/backend
command=/var/www/canyum-exam/backend/.venv/bin/uvicorn main:app --host 127.0.0.1 --port 8000
user=www
autostart=true
autorestart=true
startretries=3
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/canyum-backend.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=SECRET_KEY="change-this-in-production",DATABASE_PATH="/var/www/canyum-exam/backend/data/test.db",CORS_ORIGINS="https://exam.example.com,https://admin.example.com"
